---
layout: default
---
<article>
  <section class="page-hero work-hero">
    <div class="container work-hero-grid">
      <div>
        <a class="back-link" href="{{ '/works/' | relative_url }}"><span aria-hidden="true">←</span> All works</a>
        <h1>{{ page.title }}</h1>
        <p class="lead">{{ page.tagline }}</p>
        {% if page.links %}
        <div class="btn-row">
          {% for l in page.links %}
            <a class="btn {% if forloop.first %}btn-primary{% else %}btn-ghost{% endif %}" href="{{ l.url }}" target="_blank" rel="noopener noreferrer">{{ l.label }}</a>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <div class="work-cover">
        <img src="{{ page.cover | relative_url }}" alt="{{ page.title }} cover art" width="{{ page.cover_w | default: 460 }}" height="{{ page.cover_h | default: 215 }}">
      </div>
    </div>
  </section>
  <section class="section">
    <div class="container prose">
      {{ content }}
    </div>
  </section>
  {% if page.video %}
  <section class="section section-alt">
    <div class="container">
      <h2>Trailer</h2>
      <div class="video-frame">
        <video controls preload="metadata" playsinline>
          <source src="{{ page.video | relative_url }}" type="video/mp4">
        </video>
      </div>
    </div>
  </section>
  {% endif %}
</article>
