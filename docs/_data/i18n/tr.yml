about:
  who_title: Biz kimiz
  who_1: Stüdyomuz Umigame, 2024'te Türkiye'de bir kuluçka merkezinde kuruldu. Ekibimiz beş özverili üyeden oluşuyor.
  who_2: Oyunculara benzersiz deneyimler sunan, keyifli oyunlar yapmayı amaçlıyoruz. Koleksiyonumuz, her biri özenle geliştirilmiş çeşitli türleri kapsıyor. Kendimizi geliştirmek ve yeni fikirleri keşfetmek için yoldayız; bu yolculukta desteğiniz için teşekkür ederiz.
  what_eyebrow: Ne yapıyoruz
  what_title: Oyunları nasıl yapıyoruz
  values:
    - { title: Önce hikâye, text: "Seçimlerin ve karakterlerin deneyimi yönlendirdiği, hikâye odaklı oyunlar geliştiriyoruz." }
    - { title: Birçok tür, text: "RPG maceralarından görsel romanlara, psikolojik korkudan hayatta kalma ve yönetim oyunlarına kadar." }
    - { title: Özenle yapılır, text: "Her oyun özenle geliştiriliyor; kendimizi geliştirmeye ve yeni fikirleri keşfetmeye devam ediyoruz." }
