{%- assign t = site.data.i18n[page.lang] -%}
<section class="section">
  <div class="container split">
    <div><h2>{{ t.about.who_title }}</h2></div>
    <div class="prose">
      <p>{{ t.about.who_1 }}</p>
      <p>{{ t.about.who_2 }}</p>
    </div>
  </div>
</section>

<section class="cta">
  <div class="container cta-inner">
    <h2>{{ t.about.cta_title }}</h2>
    <a class="btn btn-primary" href="{{ t.base | append: '/works/' | relative_url }}">{{ t.about.cta_btn }}</a>
  </div>
</section>
