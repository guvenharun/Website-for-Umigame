{%- assign w = include.work -%}
{%- assign t = site.data.i18n[w.lang] -%}
<a class="card" href="{{ w.url | relative_url }}">
  <div class="card-media"><img src="{{ w.cover | relative_url }}" alt="{{ w.title }}" loading="lazy" width="{{ w.cover_w | default: 460 }}" height="{{ w.cover_h | default: 215 }}"></div>
  <div class="card-body">
    {% if w.genre %}<p class="tag">{{ w.genre }}</p>{% endif %}
    <h3>{{ w.title }}</h3>
    <p>{{ w.tagline }}</p>
    <span class="card-cta">{{ t.ui.view_game }} <span aria-hidden="true">→</span></span>
  </div>
</a>
