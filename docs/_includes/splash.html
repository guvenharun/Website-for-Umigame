{%- comment -%} Intro screen, Home only. Shown once per browser session (see head script in default.html + main.js). {%- endcomment -%}
{%- assign t = site.data.i18n[page.lang] -%}
<div class="splash" id="splash" role="dialog" aria-label="Umigame">
  {% include cover-drift.html class="splash-bg" %}
  <div class="splash-content">
    <img class="splash-logo" src="{{ '/assets/img/logo-mark-light.png' | relative_url }}" alt="" width="270" height="380">
    <p class="splash-name">umigame</p>
    <p class="splash-studios" lang="en">{{ t.splash.studios }}</p>
  </div>
  <button type="button" class="splash-skip">{{ t.splash.skip }}</button>
  <div class="splash-progress" aria-hidden="true"></div>
</div>
